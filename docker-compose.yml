services:
  # ───────────────── DATABASE ─────────────────
  mysql:
    image: mysql:8.0
    container_name: itsm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itsm_db}
      MYSQL_USER: ${MYSQL_USER:-itsm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  # ───────────────── CACHE / BROKER ─────────────────
  redis:
    image: redis:7-alpine
    container_name: itsm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  # ───────────────── BACKEND API ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-itsm_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-itsm_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    command: >
      sh -c "python -m app.scripts.init_db &&
             python -m app.scripts.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    networks:
      - itsm-network

  # ───────────────── CELERY WORKER ─────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-itsm_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-itsm_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - itsm-network

  # ───────────────── CELERY BEAT ─────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - itsm-network

  # ───────────────── NGINX (REVERSE PROXY + FRONTEND) ─────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: itsm-nginx
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - itsm-network

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  itsm-network:
    driver: bridge
